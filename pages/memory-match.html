<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match</title>
    <link rel="stylesheet" href="memory-match-styles.css">
    <link rel="icon" href="../favicon.ico">
    <script src="confetti.js" defer></script>
    <script src="memory-match-script.js" defer></script>
    <script src="nav-toggle.js" defer></script>
</head>
<body>
<button class="nav-toggle" id="nav-toggle" aria-controls="sidenav" aria-expanded="false">☰</button>

<header>
    <h1>Memory Match</h1>
</header>

<div class="game-container">
    <div class="settings-menu">
        <h2 class="settings-title">Game Settings</h2>
        <div class="settings-control">
            <label for="size-select" class="settings-label">Size</label>
            <select id="size-select" class="settings-select">
                <option value="4">Small (4×4)</option>
                <option value="5" selected>Normal (5×5)</option>
                <option value="6">Large (6×6)</option>
            </select>
        </div>
    </div>

    <div class="stats">
        <div class="stat-row">
            <div class="stat">Moves: <span id="moves">0</span></div>
            <div class="stat">Best Moves: <span id="best-moves">—</span></div>
        </div>
        <div class="stat-row">
            <div class="stat">Time: <span id="timer">00:00</span></div>
            <div class="stat">Best Time: <span id="best-time">—</span></div>
        </div>
    </div>
    <div class="game-board" id="game-board">
        <!-- Cards will be generated by JavaScript -->
    </div>
    <button id="restart-button" class="restart-button">Restart Game</button>
</div>

<div class="message" id="message"></div>

<div class="sidenav-wrapper" id="sidenav">
    <div class="sidenav">
        <a href="../index.html">Home</a>
        <a href="tic-tac-toe.html">Tic-Tac-Toe</a>
        <a href="wordle.html">Wordle</a>
        <a href="memory-match.html" id="current-page">Memory Match</a>
        <a href="snake.html">Snake</a>
    </div>
</div>

</body>
</html>
