<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <script src="tic-tac-toe-script.js" defer></script>
    <script src="nav-toggle.js" defer></script>
    <link rel="stylesheet" href="tic-tac-toe-styles.css">
    <link rel="icon" href="../favicon.ico">
</head>
<body>
<button class="nav-toggle" id="nav-toggle" aria-controls="sidenav" aria-expanded="false">☰</button>
<div class="game-container">
    <h1 class="game-title">Tic-Tac-Toe</h1>

    <div class="settings-menu">
        <h2 class="settings-title">Game Settings</h2>
        <div class="settings-row">
            <label for="mode-select" class="settings-label">Mode</label>
            <select id="mode-select" class="settings-select">
                <option value="ai" selected>Single Player (vs AI)</option>
                <option value="multiplayer">Multiplayer</option>
            </select>
        </div>
        <div class="settings-row" id="difficulty-row">
            <label for="difficulty-select" class="settings-label">Difficulty</label>
            <select id="difficulty-select" class="settings-select">
                <option value="easy" selected>Easy</option>
                <option value="normal">Normal</option>
                <option value="impossible">Impossible</option>
            </select>
        </div>
    </div>

    <div id="status-display" class="status">Player X's turn</div>

    <div class="game-board">
        <div class="cell" data-cell-index="0"></div>
        <div class="cell" data-cell-index="1"></div>
        <div class="cell" data-cell-index="2"></div>
        <div class="cell" data-cell-index="3"></div>
        <div class="cell" data-cell-index="4"></div>
        <div class="cell" data-cell-index="5"></div>
        <div class="cell" data-cell-index="6"></div>
        <div class="cell" data-cell-index="7"></div>
        <div class="cell" data-cell-index="8"></div>
    </div>

    <button id="restart-btn" class="restart-btn">Restart Game</button>

</div>

<div class="sidenav-wrapper" id="sidenav">
    <div class="sidenav">
        <a href="../index.html">Home</a>
        <a href="tic-tac-toe.html" id="current-page">Tic-Tac-Toe</a>
        <a href="wordle.html">Wordle</a>
        <a href="memory-match.html">Memory Match</a>
        <a href="snake.html">Snake</a>
    </div>
</div>
</body>
</html>
